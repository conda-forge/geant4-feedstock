schema_version: 1

context:
  version: "10.7.4"

recipe:
  name: geant4
  version: ${{ version }}

source:
  url: https://github.com/Geant4/geant4/archive/v${{ version }}.tar.gz
  sha256: 602b41dfee1fa6b33b026d00c5bd940155d7e5d0b3495230a87e2a25b28f9996
  target_directory: src
  patches:
    - patches/0002-geant4-config-honour-dataset-env-vars.patch

build:
  number: 0
  skip: win

outputs:
  - staging:
      name: geant4-toolkit
    build:
      script:
        file: build_geant4
        env:
          GEANT4_USE_QT: ${{ "ON" if geant4_variant == "qt" else "OFF" }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
        - if: build_platform != target_platform and geant4_variant == "qt"
          then: qt-main
      host:
        # 10.7 requires CLHEP >= 2.4.4.0; clhep's run_exports carry the pin.
        - clhep
        - expat
        - freetype
        - xerces-c
        - zlib
        - if: geant4_variant == "qt"
          then: qt-main
        - if: linux
          then:
            - libgl-devel
            - xorg-libx11
            - xorg-libxmu

  - package:
      name: geant4
    inherit: geant4-toolkit
    build:
      string: ${{ geant4_variant }}_${{ hash }}_${{ build_number }}
      variant:
        down_prioritize_variant: ${{ 0 if geant4_variant == "qt" else 1 }}
      files:
        - bin/geant4-config
        - bin/geant4.csh
        - bin/geant4.sh
        - include/Geant4/**
        - lib/Geant4-${{ version }}/**
        - lib/libG4*
        - share/Geant4-${{ version }}/fonts/**
        - share/Geant4-${{ version }}/geant4make/**
        - share/Geant4-${{ version }}/tools.license
      dynamic_linking:
        overlinking_behavior: error
        overdepending_behavior: error
    requirements:
      build:
        - ${{ stdlib('c') }}
      run:
        - ${{ pin_subpackage('geant4-qt-mutex', exact=True) }}
        - if: linux
          then: libgl-devel
        # GEANT4 data packages, versions are taken from:
        # https://github.com/Geant4/geant4/blob/v${{ version }}/cmake/Modules/G4DatasetDefinitions.cmake
        # NB: For robustness, add a trailing ".0" if the version does not have a patch number.
        - geant4-data-abla =3.1.0
        - geant4-data-emlow =7.13.0
        - geant4-data-ensdfstate =2.3.0
        - geant4-data-incl =1.0.0
        - geant4-data-ndl =4.6.0
        - geant4-data-particlexs =3.1.1
        - geant4-data-photonevaporation =5.7.0
        - geant4-data-pii =1.3.0
        - geant4-data-radioactivedecay =5.6.0
        - geant4-data-realsurface =2.2.0
        - geant4-data-saiddata =2.0.0
      run_exports:
        - ${{ pin_subpackage('geant4', upper_bound='x.x.x') }}
    tests:
      - package_contents:
          strict: true
          bin:
            - geant4-config
          files:
            exists:
              - bin/geant4.csh
              - bin/geant4.sh
              - include/Geant4/G4Version.hh
              - include/Geant4/**
              - lib/Geant4-${{ version }}/Geant4Config.cmake
              - lib/Geant4-${{ version }}/**
              - lib/libG4*
              - share/Geant4-${{ version }}/fonts/**
              - share/Geant4-${{ version }}/geant4make/**
              - share/Geant4-${{ version }}/tools.license
              - etc/conda/test-files/**
            not_exists:
              - share/Geant4-${{ version }}/examples/**
              - lib/python*/site-packages/Geant4/**
      - script:
          file: test_geant4
          env:
            GEANT4_USE_QT: ${{ "ON" if geant4_variant == "qt" else "OFF" }}
        requirements:
          build:
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            - ${{ stdlib('c') }}
            - cmake
            - ninja
          run:
            - expat
            - freetype
            - zlib
            - if: geant4_variant == "qt"
              then: qt-main
            - if: linux
              then:
                - libgl-devel
                - xorg-libx11
                - xorg-libxmu
        files:
          recipe:
            - test_cmake/
    about:
      summary: Geant4 is a toolkit for the simulation of the passage of particles through matter.

  - package:
      name: geant4-examples
    build:
      noarch: generic
      skip: geant4_variant != "qt"
      variant:
        ignore_keys:
          - c_compiler
          - c_compiler_version
          - cxx_compiler
          - cxx_compiler_version
          - c_stdlib
          - c_stdlib_version
          - MACOSX_DEPLOYMENT_TARGET
          - MACOSX_SDK_VERSION
          - macos_machine
      script:
        file: install_examples
    requirements:
      run:
        - ${{ pin_subpackage('geant4', upper_bound='x.x.x') }}
    tests:
      - package_contents:
          strict: true
          files:
            exists:
              - share/Geant4-${{ version }}/examples/basic/B1/exampleB1.cc
              - share/Geant4-${{ version }}/examples/**
      - script:
          file: test_examples
        requirements:
          build:
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            - ${{ stdlib('c') }}
            - cmake
            - ninja
          run:
            - expat
            - freetype
            - zlib
            - if: geant4_variant == "qt"
              then: qt-main
            - if: linux
              then:
                - libgl-devel
                - xorg-libx11
                - xorg-libxmu
    about:
      summary: Basic, extended and advanced example applications for Geant4

  - package:
      name: geant4-qt-mutex
    build:
      # Qt is compiled into libG4interfaces, libG4OpenGL and libG4RayTracer, so
      # it cannot be a package of its own. The toolkit is built both ways
      # instead; the two builds write the same files, and this metapackage makes
      # that exclusivity visible to the solver. Pin the choice with e.g.
      # `geant4-qt-mutex=*=noqt_0`.
      string: ${{ geant4_variant }}_${{ build_number }}
      variant:
        down_prioritize_variant: ${{ 0 if geant4_variant == "qt" else 1 }}
    tests:
      - package_contents:
          strict: true
    about:
      summary: Metapackage selecting whether geant4 is built with Qt support

about:
  homepage: https://geant4.web.cern.ch/
  repository: https://github.com/Geant4/geant4
  documentation: https://geant4.web.cern.ch/support
  license: LicenseRef-Geant4
  license_file: src/LICENSE
  summary: Geant4 is a toolkit for the simulation of the passage of particles through matter.
  description: |
    Geant4 is a toolkit for the simulation of the passage of particles through
    matter. Its areas of application include high energy, nuclear and
    accelerator physics, as well as studies in medical and space science. The
    three main reference papers for Geant4 are published in Nuclear Instruments
    and Methods in Physics Research [A 506 (2003) 250-303](http://www.sciencedirect.com/science/article/pii/S0168900203013688),
    IEEE Transactions on Nuclear Science [53 No. 1 (2006) 270-278](https://ieeexplore.ieee.org/xpls/abs_all.jsp?isnumber=33833&amp;arnumber=1610988&amp;count=33&amp;index=7)
    and Nuclear Instruments and Methods in Physics Research [A 835 (2016) 186-225](http://www.sciencedirect.com/science/article/pii/S0168900216306957).

extra:
  recipe-maintainers:
    - chrisburr
    - tkittel
